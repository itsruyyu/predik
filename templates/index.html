<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prediksi Jumlah Penduduk</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">
  <div class="max-w-4xl mx-auto mt-10 bg-white p-8 rounded shadow">
    <h1 class="text-2xl font-bold mb-6 text-center">Prediksi Jumlah Penduduk Sulawesi Utara</h1>

    <form id="predictForm" class="space-y-4">
      <div>
        <label class="block font-semibold">Upload File CSV:</label>
        <input type="file" name="file" required class="w-full border rounded p-2"/>
      </div>

      <div>
        <label class="block font-semibold">Jumlah Tahun Prediksi:</label>
        <input type="number" name="years" min="1" value="5" class="w-full border rounded p-2" />
      </div>

      <div>
        <label class="flex items-center">
          <input type="checkbox" name="show_actual" class="mr-2"/>
          Tampilkan Data Aktual
        </label>
      </div>

      <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Prediksi</button>
    </form>

    <div id="loading" class="mt-4 hidden text-center text-blue-600 font-semibold">
      Memproses prediksi...
    </div>

    <div class="mt-8">
      <canvas id="populationChart" class="bg-white rounded shadow"></canvas>
    </div>

    <div class="mt-4 text-center" id="evaluation"></div>

    <div class="mt-6 text-center">
      <button id="downloadTable" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded mr-2">Unduh Tabel</button>
      <button id="downloadChart" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded">Unduh Grafik</button>
    </div>
  </div>

  <script>
    const form = document.getElementById('predictForm');
    const loading = document.getElementById('loading');
    const chartCanvas = document.getElementById('populationChart');
    const evaluation = document.getElementById('evaluation');
    let chart;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      loading.classList.remove('hidden');

      try {
        const response = await fetch('/predict', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();
        loading.classList.add('hidden');

        if (result.error) {
          alert(result.error);
          return;
        }

        const labels = result.predictions.map(item => item.year);
        const predictedData = result.predictions.map(item => item.population);

        const datasets = [{
          label: 'Prediksi Jumlah Penduduk',
          data: predictedData,
          borderColor: 'rgba(75, 192, 192, 1)',
          backgroundColor: 'rgba(75, 192, 192, 0.2)',
          fill: false,
          tension: 0.3
        }];

        if (result.actual) {
          const actualLabels = result.actual.map(item => item.year);
          const actualData = result.actual.map(item => item.population);
          datasets.unshift({
            label: 'Data Aktual',
            data: actualData,
            borderColor: 'rgba(255, 99, 132, 1)',
            backgroundColor: 'rgba(255, 99, 132, 0.2)',
            fill: false,
            tension: 0.3
          });
        }

        if (chart) chart.destroy();

        chart = new Chart(chartCanvas, {
          type: 'line',
          data: {
            labels,
            datasets
          },
          options: {
            responsive: true,
            plugins: {
              legend: {
                display: true,
                position: 'top'
              }
            }
          }
        });

        evaluation.innerHTML = `
          <p class="mt-4 font-semibold">Evaluasi Model:</p>
          <p>MAPE: ${result.mape}%</p>
          <p>MAE: ${result.mae_percent}%</p>
        `;

        window.predictionResult = result;

      } catch (err) {
        loading.classList.add('hidden');
        alert('Terjadi kesalahan saat memproses prediksi.');
        console.error(err);
      }
    });

    // Download tabel CSV
    document.getElementById('downloadTable').addEventListener('click', () => {
      if (!window.predictionResult) return;

      const rows = [['Tahun', 'Jumlah Penduduk']];
      window.predictionResult.predictions.forEach(item => {
        rows.push([item.year, item.population]);
      });

      const csv = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = 'hasil_prediksi.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    // Download grafik sebagai gambar
    document.getElementById('downloadChart').addEventListener('click', () => {
      if (!chart) return;

      const a = document.createElement('a');
      a.href = chart.toBase64Image();
      a.download = 'grafik_prediksi.png';
      a.click();
    });
  </script>
</body>
</html>
